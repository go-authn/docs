# go-authn documentation (Hugo + Hextra), built like go-fileshare/docs.
#
# Each documentation version is a separate build under
# https://go-authn.github.io/docs/<version>/, where <version> is MAJOR.MINOR of
# params.authn.version below. The CI sets it through --baseURL. This default
# is the same build.
baseURL: "https://go-authn.github.io/docs/0.6/"
title: "go-authn"
# themes/hextra is the tannevaled/hextra fork, pinned at the same commit as
# go-fileshare/docs: upstream Hextra plus opt-in features (partial menu items,
# combos, related-sites menu, page subtitle and history, darkreaderLock).
theme: hextra

# English is the default language and stays at the root of each version
# (/docs/<version>/authnd/kerberos/); other languages live under their code
# (/docs/<version>/fr/authnd/kerberos/). Each language has its own content
# directory, with the same file names, so that a page and its translation are
# paired. A language is declared here only once its content exists: a
# declared language without content would be an empty entry in the language
# switch. The flags are lipis/flag-icons' 4x3 flags (MIT,
# static/images/flags/LICENSE).
defaultContentLanguage: en
defaultContentLanguageInSubdir: false
# Chinese, Korean and Japanese text has no spaces between words: Hugo needs
# this to count words and cut summaries (as the Hextra example site does). The
# search tokenizer is the theme's own, see params.search below.
hasCJKLanguage: true

languages:
  en:
    label: "English"
    contentDir: content/en
    weight: 1
    params:
      flag: images/flags/gb.svg
  fr:
    label: "Français"
    contentDir: content/fr
    weight: 2
    params:
      flag: images/flags/fr.svg
      # Day before month: "5 octobre 2026".
      dateFormat: "2 January 2006"
      description: "L'authentification en pur Go : les facteurs qui prouvent qu'une personne est présente, un annuaire qui dit qui elle est et ce qui peut le prouver, servi en LDAP, les deux moitiés de Kerberos, et un fournisseur OpenID Connect devant une fédération SAML. CGO_ENABLED=0."
  es:
    label: "Español"
    contentDir: content/es
    weight: 3
    params:
      flag: images/flags/es.svg
      # Day, then "de" month "de" year: "5 de octubre de 2026".
      dateFormat: "2 de January de 2006"
      description: "Autenticación en Go puro: los factores que prueban que una persona está presente, un directorio que dice quién es y qué puede probarlo, servido por LDAP, las dos mitades de Kerberos y un proveedor OpenID Connect delante de una federación SAML. CGO_ENABLED=0."
  de:
    label: "Deutsch"
    contentDir: content/de
    weight: 4
    params:
      flag: images/flags/de.svg
      # Day before month: "5. Oktober 2026".
      dateFormat: "2. January 2006"
      # Neutral on purpose: "die Person", not the generic masculine "er".
      description: "Authentifizierung in reinem Go: die Faktoren, die beweisen, dass eine Person anwesend ist, ein Verzeichnis, das sagt, wer sie ist und was sie ausweisen kann, bereitgestellt über LDAP, beide Hälften von Kerberos und ein OpenID-Connect-Provider vor einer SAML-Föderation. CGO_ENABLED=0."
  zh-cn:
    label: "简体中文"
    contentDir: content/zh-cn
    weight: 5
    params:
      flag: images/flags/cn.svg
      # Year, month, day: "2026年10月5日".
      dateFormat: "2006年1月2日"
      description: "纯 Go 实现的身份认证：证明某人在场的各种因素、说明此人是谁以及可以用什么来证明的目录（通过 LDAP 提供）、Kerberos 的两半，以及位于 SAML 联合之前的 OpenID Connect 提供方。CGO_ENABLED=0。"
  ko:
    label: "한국어"
    contentDir: content/ko
    weight: 6
    params:
      flag: images/flags/kr.svg
      # Year, month, day: "2026년 10월 5일".
      dateFormat: "2006년 1월 2일"
      description: "순수 Go로 구현한 인증: 어떤 사람이 있음을 증명하는 요소, 그 사람이 누구이며 무엇으로 증명할 수 있는지 알려 주는 디렉터리(LDAP으로 제공), Kerberos의 두 절반, 그리고 SAML 페더레이션 앞에 놓이는 OpenID Connect 제공자. CGO_ENABLED=0."
  ja:
    label: "日本語"
    contentDir: content/ja
    weight: 7
    params:
      flag: images/flags/jp.svg
      # Year, month, day: "2026年10月5日".
      dateFormat: "2006年1月2日"
      description: "純粋な Go による認証：人がその場にいることを証明する要素、その人が誰であり何で証明できるかを示すディレクトリ（LDAP で提供）、Kerberos の両半分、そして SAML フェデレーションの前に立つ OpenID Connect プロバイダー。CGO_ENABLED=0。"

enableRobotsTXT: true
# Git history dates every page: "Last updated on" at the bottom of each page.
enableGitInfo: true

markup:
  goldmark:
    renderer:
      unsafe: true
    parser:
      # A translated heading keeps the English one's anchor as an explicit
      # {#id}; attributes are needed for those.
      attribute:
        title: true
    extensions:
      # Chinese and Japanese put no space between words, so the soft line
      # break of a wrapped source line must not become one: without this,
      # "服务器\n都允许" renders as "服务器 都允许". css3draft, not simple:
      # goldmark's simple style drops a break between any two wide runes,
      # Hangul included, and Korean DOES separate words with spaces;
      # css3draft drops it only when "neither side is Hangul"
      # (yuin/goldmark renderer/html/html.go, Rule2; goldmark README, CJK
      # extension).
      cjk:
        enable: true
        eastAsianLineBreaks: true
        eastAsianLineBreaksStyle: css3draft
  highlight:
    noClasses: false

module:
  hugoVersion:
    extended: false
    min: 0.146.0
  # The marks and favicons come from the go-authn brand repository (submodule
  # branding/, pinned at a release tag), published under /images/brand/. Only
  # the org mark's formats are mounted: the per-repository marks carry a name
  # plate the site does not use.
  mounts:
    - source: static
      target: static
    - source: assets
      target: assets
    - source: branding/svg/color
      target: static/images/brand/svg
      files: ["go-authn.svg"]
    - source: branding/png/color
      target: static/images/brand/png
      files: ["*/go-authn.png"]
    - source: branding/ico
      target: static/images/brand/ico
      files: ["go-authn.ico"]
    # The marks' licence (BSD-3-Clause) travels with them.
    - source: branding
      target: static/images/brand
      files: ["LICENSE"]

menu:
  main:
    # Navbar, left to right: the sibling projects, version, theme, search,
    # sources.
    - name: Projects
      identifier: projects
      weight: 2
    - name: go-fileshare
      parent: projects
      url: https://go-fileshare.github.io/
      weight: 1
    - name: go-filesystems
      parent: projects
      url: https://go-filesystems.github.io/
      weight: 2
    - name: Version
      weight: 3
      params:
        type: partial
        partial: components/version-select.html
    - name: Theme
      weight: 4
      params:
        type: theme-toggle
        combo: true
    - name: Search
      weight: 5
      params:
        type: search
    - name: GitHub
      url: https://github.com/go-authn
      weight: 6
      params:
        icon: github

params:
  versions:
    # What the version selector shows with the development icon.
    development: "dev"
  description: "Authentication in pure Go: the factors that prove somebody is present, a directory that says who they are and what can prove them, served over LDAP, both halves of Kerberos, and an OpenID Connect provider in front of a SAML federation. CGO_ENABLED=0."

  # The documentation version. Its MAJOR.MINOR is the label these pages are
  # published under (v0.1.0 -> /docs/0.1/): the CI reads it here. go-authn is
  # not one program, so the label cannot be one program's version, as it is
  # for go-fileshare. It moves with the programs below: a new minor version of
  # any of them is a new minor version here, so a reader on /docs/0.1/ keeps
  # the pages that describe what they installed.
  authn:
    version: "v0.6.2"
    # The releases these pages describe. Each is checked against the program:
    # status.md lists them, and the pages quote what these versions print.
    programs:
      authnd: "v0.13.2"
      authn-bridge: "v0.23.4"
      authn-revokd: "v0.6.6"
      sshcert: "v0.1.9"

  # The language switch (foot of the sidebar) shows the translate icon, then
  # the language's flag. It appears once a second language is declared.
  languageSwitch:
    icon: translate

  navbar:
    displayTitle: true
    displayLogo: true
    logo:
      # The cyan mark reads on both themes; the name is the site title.
      path: images/brand/svg/go-authn.svg
      dark: images/brand/svg/go-authn.svg
      width: 32
      height: 32
      # Related sites, opened from the chevron beside the title (the logo itself
      # leads to the documentation's home). Only the project's landing page:
      # the GitHub organisation is already the navbar's last item.
      menu:
        - name: go-authn
          url: https://go-authn.github.io/
          logo: images/brand/svg/go-authn.svg

  theme:
    default: system
    # The theme toggle is in the navbar (menu above), not at the foot of the sidebar.
    displayToggle: false
    # Dark Reader would darken the light theme itself; with the lock, the dark
    # theme is our own.
    darkreaderLock: true

  footer:
    enable: true
    displayCopyright: true
    displayPoweredBy: false

  displayUpdatedDate: true
  dateFormat: "January 2, 2006"

  editURL:
    enable: true
    base: "https://github.com/go-authn/docs/edit/main/content"

  toc:
    displayTags: true

  page:
    width: normal
    # The front matter description as a subtitle under the title.
    displayDescription: true
    # "Created on ... by ... · Modified on ... by ..." at the foot of each page:
    # creation from data/pagehistory.json, which the build writes with
    # the theme's cmd/pagehistory (it needs the full git history);
    # modification from git (enableGitInfo).
    history: true
    contextMenu:
      enable: false

  highlight:
    copy:
      enable: true
      display: hover

  search:
    enable: true
    type: flexsearch
    flexsearch:
      index: content
      tokenize: forward
